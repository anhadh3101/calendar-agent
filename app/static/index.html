<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAIA</title>
  <style>
    :root {
      --bg: #f8f9fc;
      --panel: #ffffff;
      --panel-2: #f1f3f8;
      --border: #e3e6ef;
      --border-strong: #c8cdd8;
      --text: #1a1d26;
      --text-soft: #3c4257;
      --muted: #6b7289;
      --accent: #4a6cf7;
      --accent-2: #3d5ce0;
      --user-bubble: #e3e6ef;
      --ok: #2e9b5f;
      --ok-bg: rgba(46, 155, 95, 0.12);
      --gaia-blue: #4a6cf7;
      --gaia-red: #e05c4e;
      --gaia-amber: #e8a317;
      --gaia-green: #2e9b5f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text-soft);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .app-layout {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    .sidebar {
      width: 260px;
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }
    .sidebar-top {
      padding: 14px 12px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section-label {
      padding: 10px 16px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #newChatBtn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      width: 100%;
      border: 1px solid rgba(74, 108, 247, 0.28);
      background: linear-gradient(180deg, rgba(74, 108, 247, 0.14) 0%, rgba(74, 108, 247, 0.08) 100%);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
      box-shadow: 0 1px 2px rgba(26, 29, 38, 0.05);
    }
    #newChatBtn:hover {
      border-color: rgba(74, 108, 247, 0.45);
      background: linear-gradient(180deg, rgba(74, 108, 247, 0.2) 0%, rgba(74, 108, 247, 0.12) 100%);
      box-shadow: 0 2px 8px rgba(74, 108, 247, 0.12);
    }
    #newChatBtn:active {
      transform: scale(0.98);
    }
    #newChatBtn .new-chat-icon {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 1px 3px rgba(61, 92, 224, 0.35);
    }
    #newChatBtn .new-chat-icon svg {
      width: 15px;
      height: 15px;
    }
    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .conversation-item {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text-soft);
      padding: 10px 12px;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s ease;
    }
    .conversation-item:hover {
      background: var(--panel-2);
    }
    .conversation-item.active {
      background: var(--panel-2);
      color: var(--text);
      font-weight: 500;
    }
    .sidebar-empty {
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .sidebar-footer {
      flex: 0 0 auto;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .chat-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(248, 249, 252, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: none;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); }
    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: conic-gradient(
        from 200deg,
        var(--gaia-blue) 0%,
        var(--gaia-red) 25%,
        var(--gaia-amber) 50%,
        var(--gaia-green) 75%,
        var(--gaia-blue) 100%
      );
    }
    .brand small { color: var(--muted); font-weight: 400; }
    .actions { display: flex; align-items: center; gap: 8px; }
    #connectBtn, #gmailConnectBtn, #notionConnectBtn, #driveConnectBtn {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border-strong);
      background: var(--panel);
      color: var(--text-soft);
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #connectBtn:hover, #gmailConnectBtn:hover, #notionConnectBtn:hover, #driveConnectBtn:hover {
      border-color: var(--accent);
      background: var(--panel-2);
    }
    #connectBtn:disabled, #gmailConnectBtn:disabled, #notionConnectBtn:disabled, #driveConnectBtn:disabled {
      opacity: 0.7; cursor: default;
    }
    #connectBtn.connected, #gmailConnectBtn.connected, #notionConnectBtn.connected, #driveConnectBtn.connected {
      background: var(--ok-bg);
      border-color: rgba(46, 155, 95, 0.45);
    }
    .service-ico { width: 22px; height: 22px; display: block; object-fit: contain; }
    #logoutBtn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-soft);
      padding: 10px 12px;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    #logoutBtn:hover {
      background: var(--panel-2);
      color: var(--text);
    }
    #logoutBtn .ico { width: 16px; height: 16px; flex: 0 0 16px; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
      min-height: 0;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .msg { display: flex; gap: 12px; margin-bottom: 24px; line-height: 1.55; align-items: flex-start; }
    .msg .avatar {
      flex: 0 0 36px; width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      box-shadow: 0 1px 3px rgba(26, 29, 38, 0.07);
    }
    .msg .avatar svg { width: 18px; height: 18px; }
    .msg.user .avatar {
      background: linear-gradient(145deg, #e8ecf4 0%, #d8deea 100%);
      color: var(--text-soft);
      border: 1px solid rgba(200, 205, 216, 0.55);
      font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    }
    .msg.bot .avatar {
      background: linear-gradient(145deg, #6b86f9 0%, #4a6cf7 55%, #3d5ce0 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(74, 108, 247, 0.28);
    }
    .msg .body { flex: 1; min-width: 0; }
    .msg .msg-sender {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      margin-bottom: 5px; line-height: 1.3;
    }
    .msg.user .msg-sender { color: var(--text); }
    .msg.bot .msg-sender { color: var(--accent-2); }
    .msg.bot .msg-sender .sender-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(74, 108, 247, 0.18);
    }
    .msg .msg-content { white-space: pre-wrap; word-wrap: break-word; color: var(--text-soft); }
    .msg .body a { color: var(--accent-2); }
    .msg .body a:hover { color: var(--accent); }
    .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
    .empty h1 { font-size: 26px; margin: 0 0 8px; color: var(--text); font-weight: 600; }
    .typing span {
      display: inline-block; width: 7px; height: 7px; margin-right: 4px;
      background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    footer { border-top: 1px solid var(--border); background: rgba(248, 249, 252, 0.92); padding: 16px 0; border-top: none;}
    .composer { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; max-height: 160px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 12px;
      padding: 12px 14px; font: inherit; line-height: 1.4;
      outline: none;
      box-shadow: 0 1px 2px rgba(26, 29, 38, 0.04);
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15); }
    #sendBtn {
      width: 44px; height: 44px; flex: 0 0 44px;
      border: none; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: #fff; display: grid; place-items: center;
      transition: background 0.15s ease;
    }
    #sendBtn:hover { background: var(--accent-2); }
    #sendBtn:disabled { opacity: 0.5; cursor: default; }
    .hint { max-width: 760px; margin: 8px auto 0; padding: 0 20px; color: var(--muted); font-size: 12px; text-align: center; }

    .contact-picker,
    .slot-picker {
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--panel);
    }
    .contact-picker h4,
    .slot-picker h4 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .contact-picker .contact-row,
    .slot-picker .slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .contact-picker .contact-row:last-child,
    .slot-picker .slot-row:last-child { border-bottom: none; }
    .contact-picker .contact-row.unavailable { opacity: 0.65; }
    .contact-picker .contact-info,
    .slot-picker .slot-info { flex: 1; min-width: 0; }
    .contact-picker .contact-name,
    .slot-picker .slot-label {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }
    .contact-picker .contact-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .contact-picker .contact-meta.unavailable {
      color: #c47a0a;
    }
    .contact-picker .contact-select,
    .slot-picker .slot-select {
      flex: 0 0 auto;
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      color: var(--text-soft);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .contact-picker .contact-select:hover:not(:disabled),
    .slot-picker .slot-select:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--panel);
    }
    .contact-picker .contact-select:disabled,
    .slot-picker .slot-select:disabled { opacity: 0.6; cursor: default; }
    .contact-picker-actions,
    .slot-picker-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .contact-picker .contact-cancel,
    .slot-picker .slot-cancel {
      border: 1px solid var(--border-strong);
      background: var(--panel);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .contact-picker .contact-cancel:hover:not(:disabled),
    .slot-picker .slot-cancel:hover:not(:disabled) {
      border-color: var(--border-strong);
      color: var(--text-soft);
      background: var(--panel-2);
    }
    .contact-picker .contact-cancel:disabled,
    .slot-picker .slot-cancel:disabled { opacity: 0.6; cursor: default; }

    .todo-picker {
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--panel);
    }
    .todo-picker h4 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .todo-picker .todo-sub {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .todo-picker .todo-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .todo-picker .todo-row:last-of-type { border-bottom: none; }
    .todo-picker .todo-row input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .todo-picker .todo-info { flex: 1; min-width: 0; }
    .todo-picker .todo-title {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }
    .todo-picker .todo-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .todo-picker-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .todo-picker .todo-cancel {
      border: 1px solid var(--border-strong);
      background: var(--panel);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .todo-picker .todo-cancel:hover:not(:disabled) {
      color: var(--text-soft);
      background: var(--panel-2);
    }
    .todo-picker .todo-confirm {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .todo-picker .todo-confirm:hover:not(:disabled) { opacity: 0.9; }
    .todo-picker button:disabled { opacity: 0.6; cursor: default; }

    .a2a-panel {
      margin-bottom: 22px;
      padding: 14px 16px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--panel-2);
    }
    .a2a-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .a2a-thread { display: flex; flex-direction: column; gap: 12px; }
    .a2a-turn { line-height: 1.5; }
    .a2a-agent-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .a2a-me .a2a-agent-label { color: var(--accent-2); }
    .a2a-peer .a2a-agent-label { color: var(--ok); }
    .a2a-body {
      font-size: 14px;
      color: var(--text-soft);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .a2a-body a { color: var(--accent-2); }
    .a2a-body a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button id="newChatBtn" type="button" title="Start a new conversation">
          <span class="new-chat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
          </span>
          New chat
        </button>
      </div>
      <div class="sidebar-section-label">Recent</div>
      <div class="conversation-list" id="conversationList">
        <div class="sidebar-empty">No conversations yet</div>
      </div>
      <div class="sidebar-footer">
        <button id="logoutBtn" type="button" title="Sign out" aria-label="Sign out">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign out
        </button>
      </div>
    </aside>

    <div class="chat-column">
  <header>
    <div class="brand">
      GAIA
      <small id="userTag">&middot; loading&hellip;</small>
    </div>
    <div class="actions">
      <button id="connectBtn" type="button" disabled title="Checking&hellip;" aria-label="Connect Google Calendar">
        <img class="service-ico" src="/assets/google-calendar.png" alt="" aria-hidden="true" />
      </button>
      <button id="gmailConnectBtn" type="button" disabled title="Checking&hellip;" aria-label="Connect Gmail">
        <img class="service-ico" src="/assets/gmail.png" alt="" aria-hidden="true" />
      </button>
      <button id="notionConnectBtn" type="button" disabled title="Checking&hellip;" aria-label="Connect Notion">
        <img class="service-ico" src="/assets/notion.png" alt="" aria-hidden="true" />
      </button>
      <button id="driveConnectBtn" type="button" disabled title="Checking&hellip;" aria-label="Connect Google Drive">
        <img class="service-ico" src="/assets/google-drive.png" alt="" aria-hidden="true" />
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap" id="messages">
      <div class="empty" id="empty">
        <h1>How can I help?</h1>
        <p>Ask about your calendar, or connect Google Calendar to get started.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message GAIA&hellip;"></textarea>
      <button id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>
    <div class="hint">GAIA is an AI agent. It can make mistakes.</div>
  </footer>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    if (!requireAuth()) {
      throw new Error("redirecting to login");
    }

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const connectBtn = document.getElementById("connectBtn");
    const gmailConnectBtn = document.getElementById("gmailConnectBtn");
    const notionConnectBtn = document.getElementById("notionConnectBtn");
    const driveConnectBtn = document.getElementById("driveConnectBtn");

    function setServiceBtnStatus(btn, label) {
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }
    const userTag = document.getElementById("userTag");
    const newChatBtn = document.getElementById("newChatBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const conversationListEl = document.getElementById("conversationList");

    function setUserTag() {
      const name = displayName(getSession());
      if (name) userTag.textContent = "\u00B7 " + name;
    }

    async function loadUser() {
      setUserTag();
      try {
        const res = await authFetch("/api/auth/me");
        if (!res.ok) return;
        const data = await res.json();
        updateSessionProfile(data);
        setUserTag();
      } catch {
        // keep whatever is in session storage
      }
    }

    loadUser();


    let statusPoll = null;
    let gmailStatusPoll = null;
    let notionStatusPoll = null;
    let driveStatusPoll = null;
    let heartbeatTimer = null;
    const HEARTBEAT_INTERVAL_MS = 60_000;

    async function sendHeartbeat() {
      try {
        await authFetch("/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ agent_url: window.location.origin }),
        });
      } catch {
        // ignore transient network errors; next interval will retry
      }
    }

    function startHeartbeat() {
      sendHeartbeat();
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);
    }

    // A conversation id ties messages to a single LangGraph thread on the server,
    // so multi-turn context is preserved.
    function newConversationId() {
      const id =
        (crypto.randomUUID && crypto.randomUUID()) ||
        "conv-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      localStorage.setItem("activeConversationId", id);
      return id;
    }
    let conversationId = null;
    let pendingProposal = null;
    let loadingConversation = false;

    function ensureConversationId() {
      if (!conversationId) conversationId = newConversationId();
      return conversationId;
    }

    function showEmptyState() {
      messagesEl.innerHTML =
        '<div class="empty" id="empty"><h1>How can I help?</h1>' +
        "<p>Ask about your calendar, or connect Google Calendar to get started.</p></div>";
    }

    function clearMessages() {
      showEmptyState();
    }

    function setActiveConversationItem(id) {
      conversationListEl.querySelectorAll(".conversation-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.id === id);
      });
    }

    function renderConversationList(conversations) {
      if (!conversations.length) {
        conversationListEl.innerHTML =
          '<div class="sidebar-empty">No conversations yet</div>';
        return;
      }
      conversationListEl.innerHTML = "";
      conversations.forEach((conv) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "conversation-item";
        btn.dataset.id = conv.id;

    async function openConversation(id) {
      if (loadingConversation || id === conversationId) return;
      loadingConversation = true;
      try {
        const res = await authFetch("/api/conversations/" + encodeURIComponent(id));
        if (!res.ok) return;
        const data = await res.json();
        conversationId = data.id;
        localStorage.setItem("activeConversationId", conversationId);
        pendingProposal = null;
        messagesEl.innerHTML = "";
        data.messages.forEach((m) => {
          addMessage(m.role === "user" ? "user" : "bot", m.content);
        });
        if (!data.messages.length) showEmptyState();
        setActiveConversationItem(conversationId);
        inputEl.focus();
      } catch {
        // keep current view on error
      } finally {
        loadingConversation = false;
      }
    }

    async function bootstrapConversations() {
      await loadConversationList();
      const savedId = localStorage.getItem("activeConversationId");
      if (savedId) {
        try {
          const res = await authFetch(
            "/api/conversations/" + encodeURIComponent(savedId)
          );
          if (res.ok) {
            const data = await res.json();
            conversationId = data.id;
            messagesEl.innerHTML = "";
            data.messages.forEach((m) => {
              addMessage(m.role === "user" ? "user" : "bot", m.content);
            });
            if (!data.messages.length) showEmptyState();
            setActiveConversationItem(conversationId);
            return;
          }
        } catch {
          // fall through to new chat
        }
      }
      conversationId = newConversationId();
      showEmptyState();
    }

    async function buildNegotiationProposal(conversationId) {
      const fallback = pendingProposal
        ? `I'd like to schedule a meeting with the following constraints: ${pendingProposal}. Please check your calendar and propose times that work.`
        : "I would like to schedule a meeting. Please check your calendar and propose available times.";

      if (!conversationId) return fallback;

      try {
        const res = await authFetch(
          "/api/conversations/" + encodeURIComponent(conversationId)
        );
        if (!res.ok) return fallback;

        const data = await res.json();
        const userMessages = (data.messages || [])
          .filter((m) => m.role === "user")
          .map((m) => (m.content || "").trim())
          .filter(Boolean);

        if (userMessages.length === 0) return fallback;

        const constraints = userMessages
          .map((text, i) => `${i + 1}. ${text}`)
          .join("\n");

        return (
          "I'd like to schedule a meeting. Here is what my owner has said in this conversation:\n\n" +
          constraints +
          "\n\nPlease check your calendar and propose times that work."
        );
      } catch {
        return fallback;
      }
    }

    function myAgentLabel() {
      const name = displayName(getSession());
      return name ? name + "'s agent" : "Your agent";

    function peerAgentLabel(contact) {
      const name = contact.display_name || contact.email;
      return name ? name + "'s agent" : "Their agent";
    }

    function formatNegotiationText(transcript, labels) {
      const myLabel = labels?.myAgent || "Your agent";
      const peerLabel = labels?.peerAgent || "Their agent";
      return transcript
        .map((t) => {
          const who = t.from === "me" ? myLabel : peerLabel;
          return who + ": " + (t.text || "");
        })
        .join("\n\n");
    }

    function inferNegotiationOutcome(transcript) {
      const withStatus = transcript.filter((t) => t.from === "me" && t.status);
      if (withStatus.length === 0) return "stuck";
      return withStatus[withStatus.length - 1].status;
    }

    function parseSseBuffer(buffer) {
      const normalized = buffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const frames = [];
      const parts = normalized.split("\n\n");
      const remainder = parts.pop() || "";
      for (const part of parts) {
        if (!part.trim()) continue;
        let eventName = "message";
        let dataStr = "";
        for (const line of part.split("\n")) {
          if (line.startsWith("event:")) eventName = line.slice(6).trim();
          else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
        }
        if (!dataStr) continue;
        try {
          frames.push({ event: eventName, data: JSON.parse(dataStr) });
        } catch (_) {
          // ignore malformed frames
        }
      }
      return { frames, remainder };
    }

    async function resumeContactSelection(contact, btn, pickerEl) {
      disableContactPicker(pickerEl);
      btn.textContent = "Negotiating\u2026";

      const typing = addTyping();
      sendBtn.disabled = true;
      const proposal = await buildNegotiationProposal(conversationId);
      let negotiation = { transcript: [], outcome: "stuck" };
      let transcript = [];

      try {
        const negoRes = await authFetch("/api/a2a/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            peer_url: contact.agent_url,
            proposal,
            thread_id: negotiationThreadId(conversationId),
          }),
        });

        const agentLabels = {
          myAgent: myAgentLabel(),
          peerAgent: peerAgentLabel(contact),
        };

        if (negoRes.ok) {
          const negoData = await negoRes.json();
          transcript = negoData.transcript || [];
          negotiation = {
            transcript,
            outcome: inferNegotiationOutcome(transcript),
          };
        }

        const res = await authFetch("/api/chat/resume", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            conversation_id: conversationId,
            resume: {
              contact_id: contact.id,
              negotiation,
            },
          }),
        });

        typing.remove();

        if (!negoRes.ok) {
          addMessage(
            "bot",
            "Negotiation failed: the server returned " + negoRes.status + "."
          );
        } else if (transcript.length > 0) {
          renderA2AThread(transcript, agentLabels);
        }

        if (!res.ok) {
          addMessage("bot", "Error resuming chat: the server returned " + res.status + ".");
          reenableContactPicker(pickerEl, btn);
          return;
        }

        const data = await res.json();
        handleChatResponse(data);
        pendingProposal = null;
      } catch (e) {
        typing.remove();
        addMessage("bot", "Network error: " + e.message);
        reenableContactPicker(pickerEl, btn);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

          addMessage("bot", "Error: could not cancel.");
          cancelBtn.disabled = false;
          cancelBtn.textContent = "Cancel";
          return;
        }
        const data = await res.json();
        addMessage("bot", data.reply || "Booking cancelled.");
        conversationId = newConversationId();
      } catch (e) {
        typing.remove();
        addMessage("bot", "Network error: " + e.message);
        cancelBtn.disabled = false;
        cancelBtn.textContent = "Cancel";
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function handleChatResponse(data, streamingContentEl) {
      if (data.status === "interrupt" && data.interrupt?.type === "contact_selection") {
        if (streamingContentEl) streamingContentEl.closest(".msg")?.remove();
        showContactPicker(data.interrupt);
        return;
      }
      if (data.status === "interrupt" && data.interrupt?.type === "slot_selection") {
        if (streamingContentEl) streamingContentEl.closest(".msg")?.remove();
        showSlotPicker(data.interrupt);
        return;
      }
      if (data.status === "interrupt" && data.interrupt?.type === "todo_confirmation") {
        if (streamingContentEl) streamingContentEl.closest(".msg")?.remove();
        showTodoConfirm(data.interrupt);
        return;
      }
      if (streamingContentEl) {
        if (data.reply) {
          streamingContentEl.innerHTML = renderContent(data.reply);
        } else if (!streamingContentEl.textContent.trim()) {
          streamingContentEl.innerHTML = renderContent("(no response)");
        }
        refreshStatus();
        refreshGmailStatus();
        refreshNotionStatus();
        refreshDriveStatus();
        loadConversationList();
        return;
      }
      addMessage("bot", data.reply || "(no response)");
      refreshStatus();
      refreshGmailStatus();
      refreshNotionStatus();
      refreshDriveStatus();
      loadConversationList();
    }

    async function refreshStatus() {
      try {
        const res = await authFetch("/api/calendar/status");

          connectBtn.classList.add("connected");
          setServiceBtnStatus(connectBtn, "Google Calendar connected");
          if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
        } else {
          connectBtn.classList.remove("connected");
          setServiceBtnStatus(connectBtn, "Connect Google Calendar");
        }
        return data.connected;
      } catch (e) {
        connectBtn.disabled = false;
        setServiceBtnStatus(connectBtn, "Connect Google Calendar");
        return false;
      }
    }

        const res = await authFetch("/api/calendar/connect", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          setServiceBtnStatus(connectBtn, data.detail || "Connect failed \u2014 retry");
          return;
        }
        if (data.redirect_url) {
          window.open(data.redirect_url, "_blank", "noopener");
          setServiceBtnStatus(connectBtn, "Waiting for approval\u2026");
          if (statusPoll) clearInterval(statusPoll);
          statusPoll = setInterval(refreshStatus, 2500);
        } else {
          setServiceBtnStatus(connectBtn, "Connect failed \u2014 retry");
        }
      } catch (e) {
        setServiceBtnStatus(connectBtn, "Connect failed \u2014 retry");
      } finally {

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      autoGrow();
      addMessage("user", text);
      sendBtn.disabled = true;
      const typing = addTyping();
      let contentEl = null;
      try {
        pendingProposal = text;
        const res = await authFetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            conversation_id: ensureConversationId(),
          }),
        });
        typing.remove();
        if (!res.ok) {
          let detail = String(res.status);
          try {
            const err = await res.json();
            detail = err.detail || detail;
          } catch (_) {
            // keep status code
          }
          addMessage("bot", "Error: the server returned " + detail + ".");
          return;
        }

        contentEl = addMessage("bot", "");
        let fullText = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let finished = false;

        function consumeSseFrames(frames) {
          for (const frame of frames) {
            if (frame.event === "token" && frame.data.content) {
              fullText += frame.data.content;
              contentEl.innerHTML = renderContent(fullText);
              scrollChatToBottom();
            } else if (frame.event === "done") {
              finished = true;
              if (frame.data.conversation_id) {
                conversationId = frame.data.conversation_id;
                localStorage.setItem("activeConversationId", conversationId);
              }
              handleChatResponse(frame.data, contentEl);
            } else if (frame.event === "error") {
              finished = true;
              contentEl.innerHTML = renderContent(
                "Error: " + (frame.data.detail || "Unknown error")
              );
            }
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parsed = parseSseBuffer(buffer);
          buffer = parsed.remainder;
          consumeSseFrames(parsed.frames);
        }

        if (buffer.trim()) {
          const parsed = parseSseBuffer(buffer + "\n\n");
          consumeSseFrames(parsed.frames);
        }

        if (!finished && contentEl) {
          contentEl.innerHTML = renderContent(
            fullText || "Error: stream ended before the response completed."
          );
        }
      } catch (e) {
        typing.remove();
        if (contentEl) {
          contentEl.closest(".msg")?.remove();
        }
        addMessage("bot", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    newChatBtn.addEventListener("click", () => {
      conversationId = newConversationId();
      pendingProposal = null;
      clearMessages();
      setActiveConversationItem("");
      inputEl.focus();
    });

    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);

    logoutBtn.addEventListener("click", async () => {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      try {
        await authFetch("/api/auth/logout", { method: "POST" });
      } catch (e) {
        // still clear local session
      }
      clearSession();
      window.location.href = "/login.html";
    });

    startHeartbeat();
    refreshStatus();
    refreshGmailStatus();
    refreshNotionStatus();
    refreshDriveStatus();
    bootstrapConversations();
