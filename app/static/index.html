<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xpander Agent</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1b212d;
      --border: #2a3140;
      --text: #e7ebf3;
      --muted: #98a2b3;
      --accent: #6c8cff;
      --accent-2: #4f6ef7;
      --user-bubble: #2b3550;
      --ok: #34d399;
      --ok-bg: rgba(52, 211, 153, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #161b27 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 24, 33, 0.7);
      backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .brand small { color: var(--muted); font-weight: 400; }
    .actions { display: flex; align-items: center; gap: 8px; }
    #connectBtn, #newChatBtn {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #connectBtn:hover, #newChatBtn:hover { border-color: var(--accent); }
    #connectBtn:disabled { opacity: 0.7; cursor: default; }
    #connectBtn.connected { color: var(--ok); background: var(--ok-bg); border-color: rgba(52,211,153,0.4); }
    #connectBtn .ico { width: 16px; height: 16px; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .msg { display: flex; gap: 14px; margin-bottom: 22px; line-height: 1.55; }
    .msg .avatar {
      flex: 0 0 32px; width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center; font-size: 14px; font-weight: 600;
    }
    .msg.user .avatar { background: var(--user-bubble); }
    .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
    .msg .body { padding-top: 4px; white-space: pre-wrap; word-wrap: break-word; }
    .msg .body a { color: var(--accent); }
    .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
    .empty h1 { font-size: 26px; margin: 0 0 8px; color: var(--text); }
    .typing span {
      display: inline-block; width: 7px; height: 7px; margin-right: 4px;
      background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    footer { border-top: 1px solid var(--border); background: rgba(20,24,33,0.7); padding: 16px 0; }
    .composer { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; max-height: 160px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font: inherit; line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    #sendBtn {
      width: 44px; height: 44px; flex: 0 0 44px;
      border: none; border-radius: 12px; cursor: pointer;
      background: var(--accent-2); color: #fff; display: grid; place-items: center;
      transition: background 0.15s ease;
    }
    #sendBtn:hover { background: var(--accent); }
    #sendBtn:disabled { opacity: 0.5; cursor: default; }
    .hint { max-width: 760px; margin: 8px auto 0; padding: 0 20px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      Xpander Agent
      <small id="userTag">&middot; loading&hellip;</small>
    </div>
    <div class="actions">
      <button id="newChatBtn" title="Start a new conversation">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        New Chat
      </button>
      <button id="connectBtn" disabled>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
        <span id="connectLabel">Checking&hellip;</span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap" id="messages">
      <div class="empty" id="empty">
        <h1>How can I help?</h1>
        <p>Ask about your calendar, or connect Google Calendar to get started.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the agent&hellip;"></textarea>
      <button id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>
    </div>
    <div class="hint">The agent uses tools via Composio. Connection is stored per user, not in this app.</div>
  </footer>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const connectBtn = document.getElementById("connectBtn");
    const connectLabel = document.getElementById("connectLabel");
    const userTag = document.getElementById("userTag");
    const newChatBtn = document.getElementById("newChatBtn");

    let statusPoll = null;

    // A conversation id ties messages to a single LangGraph thread on the server,
    // so multi-turn context is preserved. Persisted so a refresh keeps the thread.
    function newConversationId() {
      const id =
        (crypto.randomUUID && crypto.randomUUID()) ||
        "conv-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      localStorage.setItem("conversationId", id);
      return id;
    }
    let conversationId =
      localStorage.getItem("conversationId") || newConversationId();

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Render plain text, converting markdown links [text](url) into anchors.
    function renderContent(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      );
    }

    function addMessage(role, text) {
      const empty = document.getElementById("empty");
      if (empty) empty.remove();
      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "AI";
      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = renderContent(text);
      msg.appendChild(avatar);
      msg.appendChild(body);
      messagesEl.appendChild(msg);
      document.getElementById("main").scrollTop = document.getElementById("main").scrollHeight;
      return body;
    }

    function addTyping() {
      const empty = document.getElementById("empty");
      if (empty) empty.remove();
      const msg = document.createElement("div");
      msg.className = "msg bot";
      msg.innerHTML =
        '<div class="avatar">AI</div><div class="body"><span class="typing"><span></span><span></span><span></span></span></div>';
      messagesEl.appendChild(msg);
      document.getElementById("main").scrollTop = document.getElementById("main").scrollHeight;
      return msg;
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/calendar/status");
        const data = await res.json();
        if (data.user_id) userTag.textContent = "\u00B7 " + data.user_id;
        connectBtn.disabled = false;
        if (data.connected) {
          connectBtn.classList.add("connected");
          connectLabel.textContent = "Calendar Connected";
          if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
        } else {
          connectBtn.classList.remove("connected");
          connectLabel.textContent = "Connect Google Calendar";
        }
        return data.connected;
      } catch (e) {
        connectBtn.disabled = false;
        connectLabel.textContent = "Connect Google Calendar";
        return false;
      }
    }

    connectBtn.addEventListener("click", async () => {
      if (connectBtn.classList.contains("connected")) return;
      connectBtn.disabled = true;
      connectLabel.textContent = "Opening\u2026";
      try {
        const res = await fetch("/api/calendar/connect", { method: "POST" });
        const data = await res.json();
        if (data.redirect_url) {
          window.open(data.redirect_url, "_blank", "noopener");
          connectLabel.textContent = "Waiting for approval\u2026";
          if (statusPoll) clearInterval(statusPoll);
          statusPoll = setInterval(refreshStatus, 2500);
        } else {
          connectLabel.textContent = "Connect Google Calendar";
        }
      } catch (e) {
        connectLabel.textContent = "Connect failed \u2014 retry";
      } finally {
        connectBtn.disabled = false;
      }
    });

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      autoGrow();
      addMessage("user", text);
      sendBtn.disabled = true;
      const typing = addTyping();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, conversation_id: conversationId }),
        });
        typing.remove();
        if (!res.ok) {
          addMessage("bot", "Error: the server returned " + res.status + ".");
        } else {
          const data = await res.json();
          addMessage("bot", data.reply || "(no response)");
          refreshStatus();
        }
      } catch (e) {
        typing.remove();
        addMessage("bot", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    newChatBtn.addEventListener("click", () => {
      conversationId = newConversationId();
      messagesEl.innerHTML =
        '<div class="empty" id="empty"><h1>How can I help?</h1>' +
        "<p>Ask about your calendar, or connect Google Calendar to get started.</p></div>";
      inputEl.focus();
    });

    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener("click", send);

    refreshStatus();
    inputEl.focus();
  </script>
</body>
</html>
